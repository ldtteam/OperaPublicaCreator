name: Sync Remote Branch

on:
  workflow_call:
    inputs:
      version:
        description: 'The version string (e.g., 1.20.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-remote-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch --all

      - name: Checkout release/<version> branch
        run: |
          git checkout release/${{ inputs.version }}

      - name: Fast-forward release/<version> to version/<version>
        run: |
          git merge --ff-only origin/version/${{ inputs.version }}

      - name: Push updated release/<version> branch
        run: |
          git push origin release/${{ inputs.version }}
